<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>İlk Projem</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: system-ui, sans-serif; background: #fdf6e3; color: #222; text-align: center; padding: 16px; }
    h1 { font-size: 2.2rem; margin-bottom: 8px; }
    button { font-size: 1.2rem; padding: 12px 24px; border: none; border-radius: 12px;
             background: #2da44e; color: white; cursor: pointer; }
    #sayi { font-size: 3rem; margin: 16px 0; }
  </style>
</head>
<body>
  <main>
    <h1>👋 Merhaba, bu benim ilk projem!</h1>
    <p>Bu sayfayı yapay zekâ ile birlikte yaptım.</p>
    <div id="sayi">0</div>
    <button onclick="document.getElementById('sayi').textContent++">Bana tıkla ⭐</button>
    <p><a href="yapilacaklar.html">✅ Yapılacaklar listeme git</a></p>
  </main>
</body>
</html>
